plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

base {
	archivesName = project.archives_base_name
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
	maven {
		name = 'Ladysnake'
		url = 'https://maven.ladysnake.org/releases'
		content {
			includeGroup 'org.ladysnake.cardinal-components-api'
		}
	}
}

loom {
	accessWidenerPath = file("src/main/resources/elytraslotenchants.accesswidener")
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "elytraslotenchants-test"
		enableGameTests = true
		enableClientGameTests = false
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	modImplementation "maven.modrinth:trinkets:${project.trinkets_version}"
	// Embarqués dans le jar de Trinkets, mais absents de son POM Modrinth.
	modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}"
	modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cca_version}"
	modLocalRuntime "maven.modrinth:elytra-slot:${project.elytraslot_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def name = project.archives_base_name
	inputs.property "archivesName", name
	from(file("LICENSE")) {
		rename { "${it}_${name}" }
	}
}
